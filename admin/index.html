<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家常菜谱手账 · 自用编辑</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#4b3828;font:16px/1.5 system-ui,sans-serif;background:radial-gradient(circle at 96% 12%,#ddefdc,transparent 36%),linear-gradient(160deg,#faf7e8,#f4f2db)}header{text-align:center;padding:17px;background:#f6f1d9;font-weight:700}main{max-width:680px;margin:auto;padding:22px 15px 110px}h1{margin:4px 0;font-size:27px}h2,p{margin:0}small{color:#087f79;font-weight:700;letter-spacing:2px}.muted{color:#786b5d;font-size:14px}form,article,nav,dialog{background:#fffaf0;border:1px solid #c4b493}form{display:flex;align-items:center;gap:8px;border-radius:30px;padding:5px 8px 5px 14px;margin:12px 0}input{flex:1;min-width:0;background:none;border:0;font:inherit;padding:5px}button{font:inherit;color:inherit;border:1px solid #c4b493;background:#fffaf0;border-radius:24px;padding:6px 14px;cursor:pointer}form button{background:#e4f8e9;color:#087f79;border:0}.active{background:#0caea6;color:white;border-color:#087f79}#filters{display:flex;overflow:auto;gap:8px;margin:0 0 16px;padding-bottom:4px;white-space:nowrap}article{display:flex;gap:12px;padding:10px;border-radius:17px;margin-bottom:13px;box-shadow:0 4px #4b38281c}article img{width:28%;max-width:124px;object-fit:cover;border-radius:12px;aspect-ratio:1}article section{flex:1;min-width:0}article h2 button{border:0;padding:0;font-size:17px;font-weight:750;text-align:left}article footer{display:flex;gap:8px;margin-top:6px}article footer button{font-size:14px}nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(96%,650px);display:flex;gap:5px;padding:5px;border-radius:32px;box-shadow:0 3px #4b382828}nav button{flex:1;border:0}dialog{width:min(92vw,520px);max-height:85vh;border-radius:20px;color:inherit}dialog img{width:100%;max-height:250px;object-fit:cover;border-radius:12px}dialog::backdrop{background:#36291977}dialog form{justify-content:flex-end;border:0;margin:0}textarea{width:100%;min-height:95px;font:inherit}#notice{min-height:24px;margin:8px 0}
article footer{flex-wrap:wrap}
.dish-cover{flex:0 0 28%;max-width:124px;align-self:flex-start;border:0;padding:0;background:transparent;border-radius:12px;overflow:hidden}
.dish-cover img{display:block;width:100%;max-width:none;aspect-ratio:1;object-fit:cover}
.dish-cover:focus-visible{outline:3px solid #087f79;outline-offset:3px}
#publish-controls{margin-top:12px}
.publish-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.guest-link{display:inline-block;color:#087f79;background:#fffaf0;border:1px solid #c4b493;border-radius:24px;padding:6px 14px;text-decoration:none}
#publish-status:empty{display:none}
</style>
<header>家常菜谱手账 · 自用编辑</header>
<main>
<section id="intro"><small>把家常味道收进手账</small><h1>今天学做哪道菜？</h1><p class="muted">点击图片或菜名，查看食材和做法。想吃的菜，也可以加入清单。</p>
  <div id="publish-controls">
    <div class="publish-actions">
      <button type="button" id="publish-menu" class="active">发布到客人版</button>
      <a class="guest-link" href="https://asunafy.github.io/recipe-menu/" target="_blank" rel="noopener noreferrer">GitHub Pages 客人版</a>
      <a class="guest-link" href="https://menu-10d393w3.maozi.io/" target="_blank" rel="noopener noreferrer">帽子云客人版</a>
    </div>
    <p id="publish-status" class="muted" role="status"></p>
  </div>
</section>
<form id="search" role="search"><span aria-hidden="true">⌕</span><input id="query" type="search" aria-label="搜索菜谱" placeholder="搜索菜名或简介"><button>搜索</button></form>
<div id="filters" aria-label="菜品分类"></div>
<div id="list"></div><div id="share" hidden><textarea id="selection" readonly aria-label="已选菜单"></textarea><button id="copy" class="active">复制菜单</button><p id="notice" role="status"></p></div>
</main>
<nav aria-label="页面导航"><button data-tab="menu">▤ 菜谱</button><button data-tab="favorites">♡ 收藏</button><button data-tab="picked">☷ 想吃清单</button><button id="add">＋ 添加菜</button></nav>
<dialog id="detail"><form method="dialog"><button>关闭</button></form><div id="recipe"></div></dialog>
<dialog id="editor">
  <form method="dialog"><button>关闭</button></form>
  <h2 id="editor-title">添加菜谱</h2>
  <p class="muted">先保存草稿，再到首页点「发布到客人版」。</p>
  <form id="dish-form" style="display:grid;padding:0;justify-content:stretch">
    <label>菜名 <input name="name" required maxlength="60"></label>
    <label>分类 <input name="category" required maxlength="20" list="category-options"><datalist id="category-options"></datalist></label>
    <label>简介 <input name="summary" maxlength="150"></label>
    <label>人份 <input name="servings" type="number" min="1" max="100" value="2" required></label>
    <label>封面（可选） <input name="cover" type="file" accept="image/*"></label>
    <label>食材，每行一种<textarea name="ingredients" required placeholder="鸡蛋 2个"></textarea></label>
    <label>做法，每行一步<textarea name="steps" required placeholder="将鸡蛋打散"></textarea></label>
    <button id="save-dish">保存菜谱</button>
    <button type="button" id="delete-dish" hidden style="color:#a52e29">删除菜谱</button>
    <button type="button" id="export-dishes">导出发布数据</button>
    <p id="editor-status" role="status"></p>
  </form>
</dialog>
<dialog id="publish-dialog">
  <form method="dialog"><button>关闭</button></form>
  <h2>发布到客人版</h2>
  <p>菜单和封面将提交到 asunafy/recipe-menu，随后由 GitHub Pages 部署。</p>
  <p class="muted">需要这个仓库的 GitHub 细粒度令牌，授予 Contents 读写权限。令牌仅用于本次发布。</p>
  <p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">在 GitHub 创建发布令牌</a></p>
  <form id="publish-form" style="display:grid">
    <label>GitHub 令牌 <input id="github-token" type="password" autocomplete="off" required></label>
    <button id="confirm-publish" type="submit">确认发布</button>
  </form>
  <p id="publish-detail" role="status"></p>
</dialog>
<script src="../dishes.js"></script><script src="editor.js"></script><script src="app.js"></script><script src="publish.js"></script>
</html>
